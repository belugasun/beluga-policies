  <h1>제3자 정보 제공 동의</h1>

  <h2>제1조 (목적)</h2>

  <p>
    본 약관은 위픽캠(이하 "회사")이 제공하는
    1:1 영상 커뮤니케이션 서비스의 이용과 관련하여
    회사와 회원 간의 권리, 의무 및 책임사항을 규정함을
    목적으로 합니다.
  </p>

  <h2>제2조 (용어의 정의)</h2>

  <ol>
    <li>
      "서비스"란 회사가 제공하는 모바일 애플리케이션을 의미합니다.
    </li>

    <li>
      "회원"이란 본 약관에 동의하고 서비스를 이용하는 자를 의미합니다.
    </li>
  </ol>
